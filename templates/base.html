<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Vía</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head><body>
<nav><b>Mi Vía</b>
<a href="{{ url_for('index') }}">Reportar</a>
<a href="{{ url_for('mapa') }}">Mapa y rutas</a>
<a href="{{ url_for('reportes') }}">Reportes</a>
{% if session.admin %}<a href="{{ url_for('logout') }}">Salir</a>{% else %}<a href="{{ url_for('login') }}">Admin</a>{% endif %}
</nav>
<main>
{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
{% block c %}{% endblock %}
</main>
<script>
function baseMap(id, lat, lon, z){
  const m = L.map(id).setView([lat, lon], z);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(m);
  return m;
}
</script>
</body></html>
