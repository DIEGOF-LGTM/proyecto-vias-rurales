{% extends "base.html" %}{% block c %}
<style>
#map{height:75vh;min-height:460px}
#map.full{position:fixed;inset:0;height:100vh;min-height:0;z-index:3000;border-radius:0}
.vpin{position:absolute;left:-6px;top:-6px;display:flex;align-items:center;gap:5px;white-space:nowrap;pointer-events:none}
.vpin i{width:12px;height:12px;box-sizing:border-box;border-radius:50%;background:#fbbf24;border:2px solid #0f172a;flex:none}
.vpin span{background:rgba(15,23,42,.88);color:#fff;padding:2px 8px;border-radius:10px;font-size:.8rem;font-weight:600;border:1px solid #fbbf24}
#titulo-vereda{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(15,23,42,.92);color:#fff;padding:10px 22px;border-radius:12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4);max-width:90%}
#titulo-vereda[hidden]{display:none}
#titulo-vereda h3{margin:0;font-size:1.7rem;line-height:1.15}
#titulo-vereda small{display:block;margin-top:4px;opacity:.85}
#titulo-vereda button{margin-top:8px}
</style>
<h2>Mapa de afectaciones y rutas</h2>
<label for="q-origen">Origen</label>
<div class="fila nowrap">
<input id="q-origen" placeholder="Busca un lugar o toca el mapa">
<button type="button" class="sec" id="b-origen">Buscar</button>
<button type="button" class="sec" id="gps">Mi ubicación</button>
</div>
<label for="q-destino">Destino</label>
<div class="fila nowrap">
<input id="q-destino" placeholder="Busca un lugar o toca el mapa">
<button type="button" class="sec" id="b-destino">Buscar</button>
<select id="sel-vereda" aria-label="Ir a una vereda"><option value="">Ir a vereda…</option></select>
</div>
<label>¿Cómo te desplazas?</label>
<div class="chips" id="modos">{% for k, m in modos.items() %}<button type="button" class="chip" data-m="{{ k }}">{{ m.icono }} {{ m.nombre }}</button>{% endfor %}</div>
<div class="fila">
<button type="button" id="calcular">Calcular ruta</button>
<button type="button" class="sec" id="swap">Invertir</button>
<button type="button" class="sec btn-full" id="full">⛶ Pantalla completa</button>
<button type="button" class="sec" id="reset">Limpiar</button>
</div>
<div id="map"></div>
<p class="suave" id="hint">Toca el mapa para fijar el origen y otra vez para el destino. Puedes arrastrar los marcadores.</p>
<div id="cal-box" hidden>
<label for="cal-out">Pega esto dentro de VEREDAS en veredas.py</label>
<textarea id="cal-out" rows="8" readonly></textarea>
</div>
<div id="info"></div>
<p class="suave leyenda">
<span class="dot" style="background:#ef4444"></span>Hueco
<span class="dot" style="background:#f97316"></span>Derrumbe
<span class="dot" style="background:#3b82f6"></span>Inundación
<span class="dot" style="background:#a855f7"></span>Drenaje
<span class="dot" style="background:#dc2626"></span>Vía cerrada / bloqueada
<span class="dot" style="background:#9ca3af"></span>Otro
</p>
<script>
const V = {{ veredas|tojson }};
const COLOR = {'Hueco':'#ef4444','Derrumbe':'#f97316','Inundación':'#3b82f6','Drenaje':'#a855f7',
               'Vía cerrada':'#dc2626','Vía bloqueada':'#7f1d1d'};
const CIERRE = ['Vía cerrada', 'Vía bloqueada'];
const RADIO_CIERRE = 80;  // metros; debe coincidir con RADIO_CIERRE_M de app.py
// Nombre alterno para buscar la vereda en OpenStreetMap cuando aún no tiene coordenadas
const ALIAS = {'Palo Gordo': 'Palogordo', 'Soaga': 'Soagá', 'El Cedro': 'El Cedro Volcán', 'Chirquín': 'Chirquin'};
const CAL = new URLSearchParams(location.search).has('calibrar');
let calN = null;

const map = baseMap('map', {{ centro[0] }}, {{ centro[1] }}, 13, false);

// Capas: relieve por defecto, calle y satélite opcionales
const relieve = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {maxNativeZoom: 17, maxZoom: 19, attribution: '© OpenTopoMap (CC-BY-SA) · © OpenStreetMap'}).addTo(map);
const calle = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, attribution: '© OpenStreetMap'});
const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxNativeZoom: 18, maxZoom: 19, attribution: 'Tiles © Esri'});
const capaVeredas = L.layerGroup().addTo(map);
L.control.layers({'Relieve': relieve, 'Calle': calle, 'Satélite': satelite}, {'Veredas': capaVeredas}).addTo(map);

// Pantalla completa: botón de arriba, botón del mapa y tecla Esc
function pantallaCompleta(forzar){
  const f = map.getContainer().classList.toggle('full', forzar);
  document.querySelectorAll('.btn-full').forEach(b => b.textContent = f ? '✕ Cerrar pantalla completa' : '⛶ Pantalla completa');
  setTimeout(() => map.invalidateSize(), 100);
}
const Ampliar = L.Control.extend({onAdd(){
  const b = L.DomUtil.create('button', 'sec btn-full');
  b.type = 'button'; b.textContent = '⛶ Pantalla completa'; b.style.cssText = 'padding:6px 10px;cursor:pointer';
  L.DomEvent.disableClickPropagation(b);
  b.onclick = () => pantallaCompleta();
  return b;
}});
new Ampliar({position: 'bottomright'}).addTo(map);
$('full').onclick = () => pantallaCompleta();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && map.getContainer().classList.contains('full')) pantallaCompleta(false);
});

const icono = t => L.divIcon({className: 'pin pin-' + t, html: t.toUpperCase(), iconSize: [26, 26]});
const P = {o: {ll: null, m: null, input: 'q-origen'}, d: {ll: null, m: null, input: 'q-destino'}};
let capas = [], rutas = [], sel = 0, meta = {};
let modo = 'carro';
try { const g = localStorage.getItem('modo'); if (g && document.querySelector('.chip[data-m="' + g + '"]')) modo = g; } catch (err) {}
function marcarModo(){ document.querySelectorAll('.chip').forEach(b => b.classList.toggle('activo', b.dataset.m === modo)); }
marcarModo();
$('modos').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  modo = b.dataset.m;
  try { localStorage.setItem('modo', modo); } catch (err) {}
  marcarModo();
  if (P.o.ll && P.d.ll) calcular();
});

// Reportes existentes (con nota de la IA y enlace a los aportes de la comunidad)
fetch('/api/reportes').then(r => r.json()).then(lista => lista.forEach(r => {
  const k = Object.keys(COLOR).find(x => r.dano.startsWith(x));
  const foto = r.foto && r.foto !== 'sin_foto.jpg'
    ? `<br><img src="/static/uploads/${encodeURIComponent(r.foto)}" width="160" alt="Foto del daño">` : '';
  const ia = r.ia && r.ia !== 'No analizado' ? `<br><small>🤖 ${esc(r.ia)}</small>` : '';
  const medio = r.medio && r.medio !== 'No indicado' ? '<br>Iba: ' + esc(r.medio) : '';
  if (CIERRE.includes(r.dano))
    L.circle([r.lat, r.lon], {radius: RADIO_CIERRE, color: '#dc2626', weight: 2, dashArray: '6 4', fillOpacity: .15, interactive: false}).addTo(map);
  L.circleMarker([r.lat, r.lon], {radius: 9, color: COLOR[k] || '#9ca3af', fillOpacity: .8, bubblingMouseEvents: false})
    .addTo(map).bindPopup(`<b>${esc(r.dano)}</b><br>${esc(r.via)} · ${esc(r.estado)}<br>${esc(r.descripcion)}${medio}${ia}<br><small>${esc(r.fecha)}</small><br><a href="/reporte/${r.id}">💬 ${r.n} aporte(s) · Ver y comentar</a>${foto}`);
})).catch(() => {});

const coordTxt = ll => ll.lat.toFixed(5) + ', ' + ll.lng.toFixed(5);
const fmt = m => m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min' : m + ' min';
const eta = m => new Date(Date.now() + m * 60000).toLocaleTimeString('es-CO', {hour: '2-digit', minute: '2-digit'});
const aviso = t => { $('info').innerHTML = '<p class="aviso">' + esc(t) + '</p>'; };

function fijar(k, ll, texto){
  const p = P[k];
  p.ll = ll;
  if (p.m) p.m.setLatLng(ll);
  else {
    p.m = L.marker(ll, {icon: icono(k), draggable: true}).addTo(map);
    p.m.on('dragend', () => { p.ll = p.m.getLatLng(); $(p.input).value = coordTxt(p.ll); calcular(); });
  }
  $(p.input).value = texto || coordTxt(ll);
  if (P.o.ll && P.d.ll) calcular();
}

// Modo calibrar (/mapa?calibrar=1): cada clic guarda la coordenada de la vereda elegida
// y junta todas las líneas en un cuadro listo para pegar en veredas.py
const calRes = {};
map.on('click', e => {
  if (CAL) {
    if (!calN) return L.popup().setLatLng(e.latlng).setContent('Primero elige una vereda en «Ir a vereda…»').openOn(map);
    calRes[calN] = [e.latlng.lat.toFixed(5), e.latlng.lng.toFixed(5)];
    $('cal-out').value = Object.entries(calRes).map(([k, v]) => '    "' + k + '": (' + v[0] + ', ' + v[1] + '),').join('\n');
    $('cal-box').hidden = false;
    L.circleMarker(e.latlng, {radius: 6, color: '#fbbf24'}).addTo(map).bindTooltip(calN);
    return;
  }
  fijar(P.o.ll ? 'd' : 'o', e.latlng);
});
if (CAL) $('hint').textContent = 'MODO CALIBRAR: cambia a Satélite, elige una vereda en "Ir a vereda…", haz clic donde está y repite con las demás. Al final copia el cuadro de abajo en veredas.py.';

async function buscar(k){
  const txt = $(P[k].input).value.trim();
  if (!txt) return;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=co'
      + '&viewbox=-74.2,5.6,-73.5,5.0&q=' + encodeURIComponent(txt);
    const d = await (await fetch(url)).json();
    if (!d.length) return aviso('No se encontró ese lugar. Prueba con otro nombre o toca el mapa.');
    const ll = L.latLng(+d[0].lat, +d[0].lon);
    fijar(k, ll, d[0].display_name.split(',').slice(0, 2).join(','));
    if (!(P.o.ll && P.d.ll)) map.flyTo(ll, 15);
  } catch (e) { aviso('No se pudo buscar. Revisa tu conexión.'); }
}
$('b-origen').onclick = () => buscar('o');
$('b-destino').onclick = () => buscar('d');
$('q-origen').addEventListener('keydown', e => { if (e.key === 'Enter') buscar('o'); });
$('q-destino').addEventListener('keydown', e => { if (e.key === 'Enter') buscar('d'); });

$('gps').onclick = () => {
  if (!navigator.geolocation) return aviso('Tu navegador no permite ubicación.');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    fijar('o', ll, 'Mi ubicación');
    if (!P.d.ll) map.flyTo(ll, 15);
  }, () => aviso('No se pudo obtener tu ubicación. Revisa el permiso del navegador.'),
  {enableHighAccuracy: true, timeout: 15000});
};

// ---- Veredas: lista completa, vuelo al elegirla y título grande ----
Object.keys(V).forEach(n => {
  const o = document.createElement('option'); o.value = n; o.textContent = n; $('sel-vereda').appendChild(o);
});
const ttl = document.createElement('div'); ttl.id = 'titulo-vereda'; ttl.hidden = true;
map.getContainer().appendChild(ttl);
L.DomEvent.disableClickPropagation(ttl);
let zona = null;
const cacheV = {};
try { const g = JSON.parse(localStorage.getItem('vcoords') || '{}'); Object.keys(g).forEach(k => cacheV[k] = L.latLng(g[k][0], g[k][1])); } catch (e) {}
const guardarCache = () => { try { const o = {}; Object.keys(cacheV).forEach(k => o[k] = [cacheV[k].lat, cacheV[k].lng]); localStorage.setItem('vcoords', JSON.stringify(o)); } catch (e) {} };
const espera = ms => new Promise(r => setTimeout(r, ms));

async function coordsDe(n){
  if (V[n]) return L.latLng(V[n][0], V[n][1]);
  if (cacheV[n]) return cacheV[n];
  const qs = [n, ALIAS[n]].filter(Boolean);       // sin coordenadas: buscarla en OpenStreetMap
  for (let i = 0; i < qs.length; i++) {
    if (i) await espera(1100);                     // Nominatim pide máximo 1 consulta por segundo
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1'
        + '&viewbox=-73.95,5.40,-73.70,5.25&q=' + encodeURIComponent(qs[i] + ', Ubaté, Cundinamarca');
      const d = await (await fetch(url)).json();
      if (d.length) { cacheV[n] = L.latLng(+d[0].lat, +d[0].lon); guardarCache(); return cacheV[n]; }
    } catch (e) {}
  }
  return null;
}

function marcarVereda(n, ll){
  L.marker(ll, {interactive: false, keyboard: false,
    icon: L.divIcon({className: '', iconSize: [0, 0], html: '<div class="vpin"><i></i><span>' + esc(n) + '</span></div>'})})
    .addTo(capaVeredas);
}
async function cargarVeredas(){
  const faltan = [];
  for (const n of Object.keys(V)) {
    const buscaba = !V[n] && !cacheV[n];
    const ll = await coordsDe(n);
    if (ll) marcarVereda(n, ll); else faltan.push(n);
    if (buscaba) await espera(1100);
  }
  if (faltan.length && !CAL)
    $('hint').textContent = 'No se pudo ubicar: ' + faltan.join(', ') + '. Agrega sus coordenadas en veredas.py (usa /mapa?calibrar=1).';
}
cargarVeredas();

async function irAVereda(n){
  calN = n;
  if (zona) { map.removeLayer(zona); zona = null; }
  ttl.hidden = false;
  ttl.innerHTML = '<h3>' + esc(n) + '</h3><small>Buscando…</small>';
  const ll = await coordsDe(n);
  if (!ll) {
    ttl.innerHTML = '<h3>' + esc(n) + '</h3><small>Esta vereda aún no tiene coordenadas. ' + (CAL ? 'Haz clic en el mapa donde queda.' : 'Agrégalas en veredas.py (usa /mapa?calibrar=1).') + '</small>';
    return;
  }
  map.flyTo(ll, 15, {duration: 1.2});
  zona = L.circle(ll, {radius: 700, color: '#fbbf24', weight: 2, dashArray: '6 4', fillOpacity: .08, interactive: false}).addTo(map);
  ttl.innerHTML = '<h3>' + esc(n) + '</h3>' + (CAL ? '' : '<button type="button" class="sec" id="usar-dest">Usar como destino</button>');
  if (!CAL) $('usar-dest').onclick = () => fijar('d', ll, n);
}
$('sel-vereda').onchange = e => { const n = e.target.value; e.target.value = ''; if (n) irAVereda(n); };

$('swap').onclick = () => {
  if (!(P.o.ll && P.d.ll)) return;
  const a = P.o.ll, b = P.d.ll, ta = $('q-origen').value, tb = $('q-destino').value;
  P.o.ll = b; P.d.ll = a; P.o.m.setLatLng(b); P.d.m.setLatLng(a);
  $('q-origen').value = tb; $('q-destino').value = ta; calcular();
};
$('reset').onclick = () => {
  limpiarRutas();
  ['o', 'd'].forEach(k => { if (P[k].m) map.removeLayer(P[k].m); P[k].m = null; P[k].ll = null; $(P[k].input).value = ''; });
  $('info').innerHTML = '';
};
$('calcular').onclick = () => calcular();

function limpiarRutas(){ capas.forEach(c => map.removeLayer(c)); capas = []; rutas = []; }

async function calcular(){
  if (!(P.o.ll && P.d.ll)) return aviso('Fija el origen y el destino.');
  limpiarRutas();
  $('info').innerHTML = '<p class="suave">Calculando…</p>';
  let data;
  try {
    data = await (await fetch(`/api/ruta?olat=${P.o.ll.lat}&olon=${P.o.ll.lng}&dlat=${P.d.ll.lat}&dlon=${P.d.ll.lng}&modo=${modo}`)).json();
  } catch (e) { return aviso('Error de conexión. Intenta de nuevo.'); }
  if (data.error) return aviso(data.error);
  rutas = data.rutas; meta = data; sel = 0; dibujar(true);
}

function dibujar(ajustar){
  capas.forEach(c => map.removeLayer(c)); capas = [];
  const orden = rutas.map((_, i) => i).filter(i => i !== sel).concat(sel);  // la elegida queda encima
  orden.forEach(i => {
    const activa = i === sel;
    const l = L.polyline(rutas[i].geometry.coordinates.map(c => [c[1], c[0]]),
      {color: activa ? '#34d399' : '#9ca3af', weight: activa ? 7 : 5, opacity: activa ? 1 : .7, bubblingMouseEvents: false}).addTo(map);
    l.on('click', () => { sel = i; dibujar(false); });
    capas.push(l);
    if (activa && ajustar) map.fitBounds(l.getBounds(), {padding: [30, 30]});
  });
  rutas[sel].afectaciones.forEach(a => capas.push(
    L.circleMarker([a.lat, a.lon], {radius: 14, color: '#fbbf24', weight: 3, fill: false, bubblingMouseEvents: false})
      .addTo(map).bindTooltip(esc(a.dano))));
  $('info').innerHTML = rutas.map((ru, i) => {
    const n = ru.afectaciones.length;
    return `<div class="ruta ${i === sel ? 'mejor' : ''}" data-i="${i}">
      <b>${i === 0 ? 'Recomendada' : 'Alternativa ' + i}</b> · <span class="t">${fmt(ru.tiempo_ajustado_min)}</span> · ${ru.distancia_km} km
      <br><span class="suave">Llegada aprox. ${eta(ru.tiempo_ajustado_min)}</span>
      ${n ? `<br><span class="aviso">${n} daño(s) reportado(s) en el camino (sin daños: ${fmt(ru.tiempo_min)})</span>`
          : '<br>Sin daños reportados en el camino'}</div>`;
  }).join('')
    + (meta.cierres ? '<p class="aviso">⛔ ' + meta.cierres + ' vía(s) cerrada(s) o bloqueada(s) reportada(s): las rutas mostradas las evitan.</p>' : '')
    + '<p class="suave">Tiempo estimado ' + esc(meta.modo).toLowerCase() + ', sin tráfico en vivo. Suma '
    + (meta.seg_dano >= 60 ? meta.seg_dano / 60 + ' min' : meta.seg_dano + ' s') + ' por cada daño reportado cerca de la ruta.'
    + (meta.aproximada ? ' Ruta calculada por carretera: no hay datos de senderos para este medio.' : '') + '</p>';
}
$('info').addEventListener('click', e => {
  const c = e.target.closest('.ruta');
  if (c && rutas.length) { sel = +c.dataset.i; dibujar(false); }
});
</script>
{% endblock %}
