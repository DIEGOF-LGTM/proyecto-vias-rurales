<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vía - Reportar Daño</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="navbar">
        <h1>🛤️ Mi Vía - Ubaté</h1>
        <nav>
            <a href="/" class="btn-nav active">Reportar</a>
            <a href="/reportes" class="btn-nav">Ver Reportes</a>
            <a href="/mapa" class="btn-nav">Ver Mapa</a>
        </nav>
    </header>

    <main class="container">
        <section class="card-form">
            <h2>Registrar Daño en Vía Rural</h2>
            <p class="subtitle">Selecciona la vereda oficial, captura la foto para la IA y detecta las coordenadas por GPS.</p>

            {% if error %}
                <div class="alert alert-error">❌ {{ error }}</div>
            {% endif %}

            <form action="/reportar" method="POST" enctype="multipart/form-data" class="formulario-via">
                
                <!-- Selector de Veredas Oficiales de Ubaté -->
                <div class="campo">
                    <label for="via">Vereda (Municipio de Ubaté):</label>
                    <select name="via" id="via" required>
                        <option value="">-- Seleccione una vereda --</option>
                        <option value="Vereda Apartadero">Vereda Apartadero</option>
                        <option value="Vereda Centro del Llano">Vereda Centro del Llano</option>
                        <option value="Vereda Guatancuy">Vereda Guatancuy</option>
                        <option value="Vereda La Patera">Vereda La Patera</option>
                        <option value="Vereda Palo Gordo">Vereda Palo Gordo</option>
                        <option value="Vereda Soagá">Vereda Soagá</option>
                        <option value="Vereda Sucunchoque">Vereda Sucunchoque</option>
                        <option value="Vereda Tausavita">Vereda Tausavita</option>
                        <option value="Vereda Volcán">Vereda Volcán</option>
                    </select>
                </div>

                <!-- Estado de la vía -->
                <div class="campo">
                    <label for="estado">Estado General de la Vía:</label>
                    <select name="estado" id="estado" required>
                        <option value="">-- Seleccione el estado --</option>
                        <option value="Bueno">Bueno (Transitable)</option>
                        <option value="Regular">Regular (Paso con precaución)</option>
                        <option value="Malo">Malo (Dificultad alta)</option>
                        <option value="Critico">Crítico (Paso restringido/cerrado)</option>
                    </select>
                </div>

                <!-- Tipos de Daño -->
                <div class="campo">
                    <label for="dano">Tipo de Daño Específico:</label>
                    <select name="dano" id="dano" required>
                        <option value="">-- Seleccione el tipo de daño --</option>
                        <option value="Hueco / Bache profundo">Hueco / Bache profundo</option>
                        <option value="Grietas / Fisuras">Grietas / Fisuras</option>
                        <option value="Pérdida de banca">Pérdida de banca</option>
                        <option value="Derrumbe / Deslizamiento">Derrumbe / Deslizamiento</option>
                        <option value="Piedra / Material suelto">Piedra / Material suelto</option>
                        <option value="Cuneta / Alcantarilla tapada">Cuneta / Alcantarilla tapada</option>
                        <option value="Vía anegada / Inundación">Vía anegada / Inundación</option>
                        <option value="Puente / Pontón dañado">Puente / Pontón dañado</option>
                    </select>
                </div>

                <!-- Cargar Foto -->
                <div class="campo">
                    <label for="foto">Fotografía del Daño (Análisis de visión IA):</label>
                    <input type="file" name="foto" id="foto" accept="image/*" capture="environment" onchange="previewImage(event)">
                    <div id="preview-box" class="preview-box" style="display:none;">
                        <img id="img-preview" src="#" alt="Previsualización">
                    </div>
                </div>

                <!-- Ubicación por GPS -->
                <div class="campo">
                    <label>Ubicación Geográfica (GPS):</label>
                    <button type="button" onclick="obtenerUbicacion()" class="btn-gps">📍 Usar mi ubicación actual</button>
                    <p id="status-gps" class="status-gps"></p>
                </div>

                <input type="hidden" name="latitud" id="latitud" required>
                <input type="hidden" name="longitud" id="longitud" required>

                <div class="campo">
                    <label for="descripcion">Descripción detallada:</label>
                    <textarea name="descripcion" id="descripcion" rows="3" placeholder="Describe puntos de referencia o detalles adicionales..."></textarea>
                </div>

                <button type="submit" class="btn-guardar">Guardar Reporte</button>
            </form>
        </section>
    </main>

    <script>
    function obtenerUbicacion() {
        const status = document.getElementById('status-gps');
        if (!navigator.geolocation) {
            status.textContent = 'La geolocalización no es soportada por tu dispositivo';
            status.style.color = 'red';
            return;
        }
        status.textContent = 'Obteniendo coordenadas GPS de Ubaté...';
        status.style.color = '#0066cc';
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById('latitud').value = position.coords.latitude;
                document.getElementById('longitud').value = position.coords.longitude;
                status.textContent = `📍 Ubicación fijada: Lat ${position.coords.latitude.toFixed(5)}, Lon ${position.coords.longitude.toFixed(5)}`;
                status.style.color = '#2e7d32';
            },
            (err) => {
                status.textContent = '⚠️ No se pudo obtener la ubicación. Ingresa coordenadas o habilita el GPS.';
                status.style.color = '#c62828';
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function previewImage(event) {
        const previewBox = document.getElementById('preview-box');
        const img = document.getElementById('img-preview');
        const file = event.target.files[0];
        if (file) {
            img.src = URL.createObjectURL(file);
            previewBox.style.display = 'block';
        }
    }
    </script>
</body>
</html>
