{% extends "base.html" %}{% block c %}
<h2>Reportar daño en la vía</h2>
<form method="post" action="{{ url_for('reportar') }}" enctype="multipart/form-data">
<label for="via">Vereda</label>
<select name="via" id="via" required>{% for v in veredas %}<option>{{ v }}</option>{% endfor %}</select>
<label for="dano">Tipo de daño</label>
<select name="dano" id="dano"><option>Hueco / Bache profundo</option><option>Derrumbe / Deslizamiento</option><option>Inundación</option><option>Drenaje</option><option>Otro</option></select>
<label for="estado">Estado de la vía</label>
<select name="estado" id="estado"><option>Bueno</option><option selected>Regular</option><option>Malo</option></select>
<label for="descripcion">Descripción</label>
<textarea name="descripcion" id="descripcion" rows="3"></textarea>
<label for="foto">Foto (opcional)</label>
<input type="file" name="foto" id="foto" accept="image/*">
<label>Toca el mapa donde está el daño</label>
<div id="map"></div>
<input type="hidden" name="latitud" id="lat"><input type="hidden" name="longitud" id="lon">
<button>Enviar reporte</button>
</form>
<script>
const V = {{ veredas|tojson }};
const map = baseMap('map', {{ centro[0] }}, {{ centro[1] }}, 13);
let marcador = null;
function poner(latlng){
  if (marcador) map.removeLayer(marcador);
  marcador = L.marker(latlng).addTo(map);
  document.getElementById('lat').value = latlng.lat;
  document.getElementById('lon').value = latlng.lng;
}
map.on('click', e => poner(e.latlng));
document.getElementById('via').addEventListener('change', e => {
  const c = V[e.target.value]; if (c) map.flyTo(c, 15);
});
document.getElementById('via').dispatchEvent(new Event('change'));
</script>
{% endblock %}
