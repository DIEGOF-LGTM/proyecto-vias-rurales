<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vía - Ubaté</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .campo { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select, input, textarea, button { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1b5e20; }
        .btn-gps { background: #0277bd; }
        .btn-gps:hover { background: #01579b; }
        #mapa-selector { height: 250px; border-radius: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛤️ Registrar Daño en Vía Rural - Ubaté</h2>
        <form action="/reportar" method="POST" enctype="multipart/form-data">
            
            <div class="campo">
                <label for="via">Vereda (Municipio de Ubaté):</label>
                <select name="via" id="via" required>
                    <option value="">-- Seleccione una vereda --</option>
                    <option value="Vereda Apartadero">Vereda Apartadero</option>
                    <option value="Vereda Centro del Llano">Vereda Centro del Llano</option>
                    <option value="Vereda Guatancuy">Vereda Guatancuy</option>
                    <option value="Vereda La Patera">Vereda La Patera</option>
                    <option value="Vereda Palo Gordo">Vereda Palo Gordo</option>
                    <option value="Vereda Soagá">Vereda Soagá</option>
                    <option value="Vereda Sucunchoque">Vereda Sucunchoque</option>
                    <option value="Vereda Tausavita">Vereda Tausavita</option>
                    <option value="Vereda Volcán">Vereda Volcán</option>
                </select>
            </div>

            <div class="campo">
                <label for="estado">Estado General de la Vía:</label>
                <select name="estado" id="estado" required>
                    <option value="Bueno">Bueno (Transitable)</option>
                    <option value="Regular" selected>Regular (Paso con precaución)</option>
                    <option value="Malo">Malo (Dificultad alta)</option>
                    <option value="Critico">Crítico (Paso restringido)</option>
                </select>
            </div>

            <div class="campo">
                <label for="dano">Tipo de Daño:</label>
                <select name="dano" id="dano" required>
                    <option value="Hueco / Bache profundo">Hueco / Bache profundo</option>
                    <option value="Grietas / Fisuras">Grietas / Fisuras</option>
                    <option value="Pérdida de banca">Pérdida de banca</option>
                    <option value="Derrumbe / Deslizamiento">Derrumbe / Deslizamiento</option>
                    <option value="Piedra / Material suelto">Piedra / Material suelto</option>
                    <option value="Cuneta / Alcantarilla tapada">Cuneta / Alcantarilla tapada</option>
                    <option value="Vía anegada / Inundación">Vía anegada / Inundación</option>
                    <option value="Puente / Pontón dañado">Puente / Pontón dañado</option>
                </select>
            </div>

            <div class="campo">
                <label for="foto">Fotografía del Daño (para Análisis IA):</label>
                <input type="file" name="foto" id="foto" accept="image/*">
            </div>

            <div class="campo">
                <label>Ubicación del Daño:</label>
                <button type="button" onclick="obtenerGPS()" class="btn-gps">📍 Usar mi ubicación actual (GPS)</button>
                <p style="font-size: 0.85em; color: #555; margin: 5px 0;">O haz clic en el mapa para marcar el punto exacto:</p>
                <div id="mapa-selector"></div>
            </div>

            <input type="hidden" name="latitud" id="latitud" value="5.3081" required>
            <input type="hidden" name="longitud" id="longitud" value="-73.8143" required>

            <div class="campo">
                <label for="descripcion">Descripción detallada:</label>
                <textarea name="descripcion" id="descripcion" rows="3" placeholder="Puntos de referencia o detalles del problema..."></textarea>
            </div>

            <button type="submit">Guardar Reporte</button>
        </form>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa centrado en Ubaté
        const map = L.map('mapa-selector').setView([5.3081, -73.8143], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([5.3081, -73.8143], {draggable: true}).addTo(map);

        function actualizarCoordenadas(lat, lng) {
            document.getElementById('latitud').value = lat;
            document.getElementById('longitud').value = lng;
        }

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            actualizarCoordenadas(e.latlng.lat, e.latlng.lng);
        });

        marker.on('dragend', function(e) {
            const position = marker.getLatLng();
            actualizarCoordenadas(position.lat, position.lng);
        });

        function obtenerGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 15);
                    marker.setLatLng([lat, lng]);
                    actualizarCoordenadas(lat, lng);
                });
            }
        }
    </script>
</body>
</html>
